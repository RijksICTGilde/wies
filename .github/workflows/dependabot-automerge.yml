# Merges Dependabot PRs with only minor and patch updates once the tests on
# the PR are green. Majors and NLDD upgrades are left for a human.
#
# The merge uses GITHUB_TOKEN, and a push made with GITHUB_TOKEN starts no push
# workflows. So after the merge this job dispatches the workflows that a push
# to main would have started: workflow_dispatch is the one trigger GITHUB_TOKEN
# may fire. That is why this merges itself instead of using auto-merge: with
# auto-merge GitHub merges later, when no job is left to dispatch anything.
#
# A workflow_run job runs the workflow from main with a write token, so it
# never checks out PR code; it only reads the PR through the API.

name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Run Tests]
    types: [completed]

# Deny by default; the job grants itself the minimum it needs.
permissions: {}

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write
      actions: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # Dependabot lists every updated dependency with its update type in the
      # commit message. Merge only if each one is a minor or patch, none is
      # NLDD, and Dependabot wrote the commit (nobody pushed on top of it).
      - name: Check the update
        id: check
        run: |
          pr_url=$(gh pr view "$HEAD_BRANCH" --json url,state,headRefOid \
            --jq "select(.state == \"OPEN\" and .headRefOid == \"$HEAD_SHA\") | .url")
          if [ -z "$pr_url" ]; then
            echo "No open PR with head $HEAD_SHA on $HEAD_BRANCH; nothing to merge."
            exit 0
          fi
          echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"

          commit=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA")
          author=$(jq -r '.author.login' <<< "$commit")
          message=$(jq -r '.commit.message' <<< "$commit")

          names=$(grep -cE '^- dependency-name:' <<< "$message" || true)
          minor_patch=$(grep -cE '^  update-type: version-update:semver-(minor|patch)$' <<< "$message" || true)

          if [ "$author" != "dependabot[bot]" ]; then
            echo "Head commit is by $author, not Dependabot; leaving it for a human."
          elif [ "$names" -eq 0 ] || [ "$names" -ne "$minor_patch" ]; then
            echo "Not only minor and patch updates; leaving it for a human."
          elif grep -qE '^- dependency-name: "?@nldd/design-system' <<< "$message"; then
            echo "NLDD upgrade; review it with nldd-design-upgrade first."
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        if: steps.check.outputs.merge == 'true'
        env:
          PR_URL: ${{ steps.check.outputs.pr-url }}
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      - name: Run the push workflows on main
        if: steps.check.outputs.merge == 'true'
        run: |
          gh workflow run main-deploy.yml --ref main
          gh workflow run test.yml --ref main
          gh workflow run security-scan.yml --ref main

      - name: Report a failed merge
        if: failure() && steps.check.outputs.pr-url != ''
        env:
          PR_URL: ${{ steps.check.outputs.pr-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_URL" --edit-last --create-if-none \
            --body "❌ Auto-merge or the deploy after it failed, see $RUN_URL. Merge by hand, or run \"Deploy to main\" if the PR is already merged."
