name: NLDD update

# Dependabot cannot see the NLDD version: it lives in the justfile and the
# bundle is vendored by `just update-vendor`, not installed from package.json.
# This opens (or refreshes) one PR per new release. It never merges: a new
# minor carries breaking changes that fail silently, so a person reviews it.

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      BRANCH: nldd-update
      # A PR opened with GITHUB_TOKEN starts no other workflows, so the tests
      # would never run on it. A token with contents + pull-requests write does.
      GH_TOKEN: ${{ secrets.NLDD_UPDATE_TOKEN }}

    steps:
      - name: Check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret NLDD_UPDATE_TOKEN is not set (fine-grained PAT: contents + pull requests, read/write)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.NLDD_UPDATE_TOKEN }}

      - name: Compare versions
        id: version
        run: |
          current=$(sed -n 's/^NLDD_VERSION := "\(.*\)"$/\1/p' justfile)
          latest=$(npm view @nldd/design-system version)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "NLDD $current is up to date."
          else
            echo "NLDD $current -> $latest"
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if the PR already has this version
        id: existing
        if: steps.version.outputs.update == 'true'
        run: |
          if git fetch --quiet origin "$BRANCH" 2>/dev/null &&
             git show "origin/$BRANCH:justfile" | grep -q "^NLDD_VERSION := \"${{ steps.version.outputs.latest }}\"$"; then
            echo "Branch $BRANCH already has ${{ steps.version.outputs.latest }}."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install just
        if: steps.existing.outputs.proceed == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - name: Vendor the new version
        if: steps.existing.outputs.proceed == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          sed -i "s/^NLDD_VERSION := \".*\"$/NLDD_VERSION := \"$LATEST\"/" justfile
          just update-vendor
          # Changelog bullet; the PR number is filled in by hand, as for any PR.
          python3 - <<'EOF'
          import os
          path = "CHANGES.md"
          text = open(path).read()
          line = f"- ???: upgrade NLDD design system from {os.environ['CURRENT']} to {os.environ['LATEST']}"
          head = "## unreleased\n\n"
          text = text.replace(head + "- tbd\n", head + line + "\n", 1) if head + "- tbd\n" in text else text.replace(head, head + line + "\n", 1)
          open(path, "w").write(text)
          EOF

      - name: Write PR body
        if: steps.existing.outputs.proceed == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          # To a file first: awk stops early, and under pipefail curl then fails.
          curl -fsSL -o "$RUNNER_TEMP/nldd-changelog.md" \
            https://raw.githubusercontent.com/NederlandseDigitaleDienst/design-system/main/CHANGELOG.md
          {
            echo "Automatische upgrade van NLDD $CURRENT naar $LATEST. Niet automatisch mergen."
            echo
            echo "Nalopen vóór merge:"
            echo "- **Breaking**-secties hieronder: hernoemde attributen, slots, events en tokens falen stil. Grep Wies erop."
            echo "- **Fixed**: maakt dit een Wies-workaround overbodig? Zie \`.claude/rules/nldd-integration.md\`."
            echo "- In de browser, licht en donker, breed en smal."
            echo "- PR-nummer invullen in \`CHANGES.md\`."
            echo
            echo "<details><summary>NLDD-changelog $CURRENT → $LATEST</summary>"
            echo
            awk -v cur="$CURRENT" '
              /^## \[/ { if (index($0, "## [" cur "]") == 1) exit; p = 1 }
              p' "$RUNNER_TEMP/nldd-changelog.md"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/body.md"

      - name: Open or update the PR
        if: steps.existing.outputs.proceed == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -q -m "Upgrade NLDD design system $CURRENT → $LATEST"
          git push --force origin "$BRANCH"
          title="Upgrade NLDD design system $CURRENT → $LATEST"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md" --label dependencies
          fi
