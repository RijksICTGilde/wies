name: Dependabot vendor

# Dependabot raises the versions in package.json only. Wies serves the vendored
# copies, so this runs `just update-vendor` on its branch and pushes the result
# to the same PR.

on:
  push:
    branches:
      - "dependabot/npm_and_yarn/**"

permissions: {}

jobs:
  vendor:
    # The push below comes from the token's owner, so this does not loop.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # A Dependabot run sees only Dependabot secrets, and a push with
      # GITHUB_TOKEN would start no tests on the PR.
      - name: Check token
        env:
          TOKEN: ${{ secrets.VENDOR_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Dependabot secret VENDOR_PUSH_TOKEN is not set (fine-grained PAT: contents read/write)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.VENDOR_PUSH_TOKEN }}

      - name: Install just
        run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - name: Vendor
        run: just update-vendor

      - name: Push the vendored files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Vendored files already match package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vendor ${GITHUB_REF_NAME#dependabot/npm_and_yarn/}"
          git push
