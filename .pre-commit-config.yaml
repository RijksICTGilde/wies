default_language_version:
  python: python3.14

exclude: "^wies/core/static/vendor/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        # Naast de templates ook het onderzoeksrapport: een zelfstandig
        # HTML-document waar herformatteren alleen ruis oplevert.
        exclude: "jinja2/|^wies/core/static/toegankelijkheid/"

  - repo: https://github.com/adamchainz/django-upgrade
    rev: "1.30.0"
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.0"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      # Het onderzoeksrapport is uitgezonderd: een gegenereerd, zelfstandig
      # HTML-document, geen Jinja-template, en herformatteren levert alleen ruis op.
      - id: djlint-reformat-jinja
        types_or: [html]
        exclude: ^wies/core/static/toegankelijkheid/
      - id: djlint-jinja
        types_or: [html]
        exclude: ^wies/core/static/toegankelijkheid/
