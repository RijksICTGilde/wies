<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/vendor/nldd/css/tokens.css" />
    <link rel="stylesheet" href="/vendor/nldd/css/variables.css" />
    <link rel="stylesheet" href="/vendor/nldd/css/global.css" />
    <link rel="stylesheet" href="/vendor/nldd/css/colors.generated.css" />
    <script type="module" src="/vendor/nldd/nldd.min.js"></script>
    <style>
      body {
        padding: 24px;
        max-width: 640px;
        font-family: system-ui;
      }
    </style>
  </head>
  <body>
    <div id="client-tree-container"></div>
    <script src="/js/tree_state.js"></script>
    <script src="/js/org_tree.js"></script>
    <script>
      // A ministry with BOTH a nested type folder (non-selectable group) and a
      // real selectable child, to expose the alignment between them.
      var data = [
        {
          id: "group-top-Adviescollege",
          label: "Adviescolleges",
          group: true,
          children: [{ id: "top-adv-1", label: "Onderwijsraad" }],
        },
        {
          id: "group-top-Agentschap",
          label: "Agentschappen",
          group: true,
          children: [{ id: "top-ag-1", label: "Logius" }],
        },
        {
          id: "ministeries",
          label: "Ministeries",
          group: true,
          children: [
            {
              id: "m-bz",
              label: "Ministerie van Buitenlandse Zaken",
              children: [
                {
                  id: "group-uuid-Adviescollege",
                  label: "Adviescolleges",
                  group: true,
                  children: [
                    {
                      id: "adv-1",
                      label: "Adviesraad Internationale Vraagstukken",
                    },
                  ],
                },
                {
                  id: "dg-1",
                  label: "Directoraat-Generaal Europese Samenwerking",
                },
                { id: "dg-2", label: "Directoraat-Generaal Politieke Zaken" },
              ],
            },
            {
              id: "m-bzk",
              label: "Ministerie van Binnenlandse Zaken en Koninkrijksrelaties",
              children: [
                {
                  id: "group-uuid-Agentschap",
                  label: "Agentschappen",
                  group: true,
                  children: [
                    {
                      id: "odi",
                      label:
                        "Rijksorganisatie voor Ontwikkeling, Digitalisering en Innovatie",
                    },
                  ],
                },
                {
                  id: "kmp",
                  label: "Kabinet Minister-President",
                  children: [{ id: "kmp-1", label: "Bestuursraad" }],
                },
              ],
            },
          ],
        },
      ];
      var state = new TreeState(data, { collapseToParent: false });
      var tree = new WiesOrgTree({
        state: state,
        container: document.getElementById("client-tree-container"),
        accessibleLabel: "Opdrachtgevers",
        isSelectable: function (node) {
          return !node.group;
        },
      });
      tree.render();
      // Expand everything for the screenshot.
      [
        "group-top-Adviescollege",
        "group-top-Agentschap",
        "ministeries",
        "m-bz",
        "m-bzk",
        "group-uuid-Adviescollege",
        "group-uuid-Agentschap",
        "kmp",
      ].forEach(function (id) {
        tree.expandAncestorsOf(id);
        var row = tree.domNodes.get(id);
        if (row) {
          tree._ensureChildren(state.getNode(id));
          row.setAttribute("expanded", "");
        }
      });
      window.__ready = true;
    </script>
  </body>
</html>
