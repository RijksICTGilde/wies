{# dialog.js opens the sheet after the htmx swap via data-auto-show.

   The body is a separate partial: on a validation error htmx replaces only
   #labelFormBody, so this sheet stays instead of a second one opening on top
   of it. #}
<nldd-sheet id="{{ modal_element_id }}" data-auto-show placement="right" width="480px" accessible-label="{{ modal_title }}">
<nldd-page sticky-header>
<nldd-top-title-bar slot="header" text="{{ modal_title }}" dismiss-text="Annuleer"></nldd-top-title-bar>
<nldd-simple-section padding-top="0">
<div id="labelFormBody">{% include "parts/label_form_body.html" %}</div>
</nldd-simple-section>
</nldd-page>
</nldd-sheet>
