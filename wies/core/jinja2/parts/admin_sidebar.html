<nldd-container slot="sidebar" padding="16">
<nldd-title size="5">
<h2>Beheer</h2>
</nldd-title>
<nldd-spacer size="8" direction="vertical"></nldd-spacer>
<nldd-list type="navigation" accessible-label="Beheer">
{# Two authorities that do not nest: the Gebruikersbeheerder keeps users,
   labels, ODI-onderdelen and reads the roles; the Applicatiebeheerder keeps the
   maintenance pages. #}
{% if show_user_admin_pages(request) %}
  <nldd-list-item href="{{ url('admin-users') }}" {% if '/beheer/gebruikers/' in request.path %}selected{% endif %}>
  <nldd-icon-cell size="20">
  <nldd-icon icon="users"></nldd-icon>
  </nldd-icon-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-text-cell text="Gebruikers"></nldd-text-cell>
  </nldd-list-item>
  <nldd-list-item href="{{ url('label-admin') }}" {% if '/beheer/labels/' in request.path %}selected{% endif %}>
  <nldd-icon-cell size="20">
  <nldd-icon icon="labels"></nldd-icon>
  </nldd-icon-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-text-cell text="Labels"></nldd-text-cell>
  </nldd-list-item>
  <nldd-list-item href="{{ url('suborganization-admin') }}" {% if request.path.startswith(url('suborganization-admin')) %}selected{% endif %}>
  <nldd-icon-cell size="20">
  <nldd-icon icon="brand"></nldd-icon>
  </nldd-icon-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-text-cell text="ODI-onderdelen"></nldd-text-cell>
  </nldd-list-item>
  <nldd-list-item href="{{ url('role-matrix') }}" {% if request.path == url('role-matrix') %}selected{% endif %}>
  <nldd-icon-cell size="20">
  <nldd-icon icon="user-admin"></nldd-icon>
  </nldd-icon-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-text-cell text="Rollen"></nldd-text-cell>
  </nldd-list-item>
{% endif %}
{% if show_staff_pages(request) %}
  <nldd-list-item href="{{ url('staff-dashboard') }}" {% if '/statistieken/' in request.path %}selected{% endif %}>
  <nldd-icon-cell size="20">
  <nldd-icon icon="chart-x-y-axis-line"></nldd-icon>
  </nldd-icon-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-text-cell text="Statistieken"></nldd-text-cell>
  </nldd-list-item>
  <nldd-list-item href="{{ url('staff-database') }}" {% if '/database/' in request.path %}selected{% endif %}>
  <nldd-icon-cell size="20">
  <nldd-icon icon="database"></nldd-icon>
  </nldd-icon-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-text-cell text="Database"></nldd-text-cell>
  </nldd-list-item>
{% endif %}
</nldd-list>
</nldd-container>
