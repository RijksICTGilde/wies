{% for error in object_list %}
  {# De hele rij opent het detail in een sheet: een aparte oogknop ernaast zou
     hetzelfde doen. Verwijderen zit in die sheet. #}
  <nldd-list-item button hx-get="{{ url('error-detail', args=[error.id]) }}?pagina={{ page_obj.number }}" hx-target="#errorSheet" hx-swap="innerHTML">
  <nldd-text-cell text="{{ error.short_description }}" supporting-text="{{ error.exception_message or error.message }}"></nldd-text-cell>
  <nldd-spacer-cell size="12"></nldd-spacer-cell>
  {# Relatief, want bij "recente foutmeldingen" wil je weten hoe lang geleden.
     De exacte tijd staat in het detail. #}
  <nldd-text-cell width="fit-content" horizontal-alignment="right" size="sm" color="secondary" text="{{ error.timestamp|tijdgeleden }}"></nldd-text-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-icon-cell size="20">
  <nldd-icon name="chevron-right"></nldd-icon>
  </nldd-icon-cell>
  </nldd-list-item>
{% else %}
  <nldd-list-item>
  <nldd-text-cell text="Geen foutmeldingen."></nldd-text-cell>
  </nldd-list-item>
{% endfor %}
