{% for error in object_list %}
  <nldd-list-item href="{{ url('error-detail', args=[error.public_id]) }}">
  <nldd-text-cell hide-below="md" width="fit-content" size="sm" color="secondary" text="{{ error.timestamp|datetime_nl }}"></nldd-text-cell>
  <nldd-spacer-cell hide-below="md" size="12"></nldd-spacer-cell>
  <nldd-text-cell divider-start width="full" text="**{{ error.short_description }}**"></nldd-text-cell>
  <nldd-spacer-cell hide-below="md" size="12"></nldd-spacer-cell>
  {% if error.path %}
    <nldd-text-cell hide-below="md" width="fit-content" max-width="240px" size="sm" color="secondary" text="{{ error.method }} {{ error.path }}"></nldd-text-cell>
  {% else %}
    <nldd-text-cell hide-below="md" width="fit-content" max-width="240px" size="sm" color="secondary" text="{{ error.logger_name }}"></nldd-text-cell>
  {% endif %}
  <nldd-spacer-cell hide-below="md" size="12"></nldd-spacer-cell>
  <nldd-text-cell hide-below="md" width="fit-content" max-width="200px" size="sm" color="secondary" text="{{ error.user_email or '–' }}"></nldd-text-cell>
  <nldd-spacer-cell size="8"></nldd-spacer-cell>
  <nldd-icon-cell size="20">
  <nldd-icon name="chevron-right"></nldd-icon>
  </nldd-icon-cell>
  </nldd-list-item>
{% else %}
  <nldd-list-item>
  <nldd-text-cell text="Geen foutmeldingen."></nldd-text-cell>
  </nldd-list-item>
{% endfor %}
