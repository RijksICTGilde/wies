{# A POST only reaches here on a validation error, and then only the body goes
   back, not the whole sheet. #}
{% if request.method == "POST" %}
  {% include "parts/profile_name_body.html" %}
{% else %}
  <nldd-sheet id="profileNameModal" data-auto-show placement="right" width="480px" accessible-label="Naam wijzigen">
  <nldd-page sticky-header>
  <nldd-top-title-bar slot="header" text="Naam wijzigen" dismiss-text="Annuleer"></nldd-top-title-bar>
  <nldd-simple-section padding-top="0">
  <div id="profileNameBody">{% include "parts/profile_name_body.html" %}</div>
  </nldd-simple-section>
  </nldd-page>
  </nldd-sheet>
{% endif %}
