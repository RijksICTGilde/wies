<div id="{{ target }}">
  <form hx-post="{{ edit_url }}"
        hx-headers='{"X-CSRFToken": "{{ get_csrf_token(request) }}"}'
        hx-target="#{{ target }}"
        hx-swap="outerHTML">
    {# Concurrency token (#483): lets the view detect rows changed meanwhile. #}
    <input type="hidden"
           name="_concurrency_token"
           value="{{ concurrency_token }}">
    {% include editable.form_template %}
    {# role="alert": the form is swapped in by htmx, so without a live region a
       screen reader never announces the blocked save (#483). #}
    {% if alert %}
      <div role="alert">
        <nldd-banner variant="{{ alert.kind }}" text="{{ alert.message }}"></nldd-banner>
      </div>
    {% endif %}
    <div class="field-actions">
      <nldd-button type="submit" variant="primary" text="Opslaan"></nldd-button>
      <nldd-button type="button" variant="secondary" text="Annuleren" hx-get="{{ edit_url }}?cancel=true" hx-target="#{{ target }}" hx-swap="outerHTML"></nldd-button>
    </div>
  </form>
</div>
