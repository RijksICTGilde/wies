{# A POST reaches this template only on a validation error: then only the body is
   returned, so the open sheet stays (pattern of generic_form_modal.html). #}
{% if request.method == "POST" %}
  {% include "parts/user_form_body.html" %}
{% else %}
  <nldd-sheet id="{{ modal_element_id }}" data-auto-show placement="right" width="480px" accessible-label="{{ modal_title }}">
  <nldd-page sticky-header>
  <nldd-top-title-bar slot="header" text="{{ modal_title }}" dismiss-text="Annuleer"></nldd-top-title-bar>
  <nldd-simple-section padding-top="0">
  <div id="{{ modal_element_id }}Body">{% include "parts/user_form_body.html" %}</div>
  </nldd-simple-section>
  </nldd-page>
  </nldd-sheet>
{% endif %}
