{# The ids are internal to this sheet and exist only while it is open.
   Cancelling lives in the title bar rather than as a second button below,
   because it is the same action as closing. #}
<nldd-sheet id="client-modal" placement="left" width="480px" accessible-label="Opdrachtgevers selecteren">
<nldd-page sticky-header sticky-footer>
<nldd-top-title-bar slot="header" text="Opdrachtgevers selecteren" dismiss-text="Annuleer"></nldd-top-title-bar>
<nldd-container slot="header" padding-inline="16">
<nldd-search-field autofocus id="client-search" placeholder="Opdrachtgever zoeken" accessible-label="Opdrachtgever zoeken">
</nldd-search-field>
</nldd-container>
<nldd-simple-section>
<div id="client-tree-container"
     data-tree="{{ hierarchy|json_attr }}"
     data-selections="{{ current_selections|json_attr }}"></div>
</nldd-simple-section>
<nldd-container slot="footer" padding="16" padding-top="0">
<nldd-container id="client-selection-tokens" layout="wrap" gap="8" hidden></nldd-container>
<nldd-spacer size="12"></nldd-spacer>
<nldd-button id="client-apply-btn" appearance="primary" width="full" text="Pas toe"></nldd-button>
</nldd-container>
</nldd-page>
</nldd-sheet>
