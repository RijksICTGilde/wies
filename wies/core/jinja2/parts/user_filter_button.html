{# Filters-knop met teller. Los bestand zodat user_table.html hem OOB kan
   meeswappen (id vast), zodat de teller na een filterwijziging meteen klopt. #}
{% set filter_button_text = "Filters (%d)" % active_filter_count if active_filter_count else "Filters" %}
<nldd-button id="user-filter-button" variant="secondary" start-icon="filter" text="{{ filter_button_text }}" hx-get="{{ url('admin-users') }}?filters=1" hx-target="#user-filter-container" hx-swap="innerHTML" hx-push-url="false">
</nldd-button>
