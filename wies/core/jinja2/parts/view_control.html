{# Rides along as an OOB fragment on every htmx swap, so the pressed button and
   the link urls follow the new filters. #}
<nldd-toolbar-item id="view-control" slot="start" priority="-1" {% if view_control_oob %}hx-swap-oob="outerHTML"{% endif %}>
<nldd-segmented-control accessible-label="Weergave" variant="icon-and-text" size="md" value="{{ active_view }}">
{% for option in view_options %}
  <nldd-segmented-control-item value="{{ option.value }}" text="{{ option.label }} ({{ option.count }})" icon="{{ option.icon }}" hx-get="{{ option.url }}" hx-trigger="item-change" hx-target="#results" hx-swap="outerHTML settle:0" hx-replace-url="true"></nldd-segmented-control-item>
{% endfor %}
</nldd-segmented-control>
<nldd-menu-group slot="overflow" text="Weergave">
{% for option in view_options %}
  <nldd-menu-item type="radio" text="{{ option.label }} ({{ option.count }})" icon="{{ option.icon }}" {% if option.selected %}selected{% endif %} hx-get="{{ option.url }}" hx-trigger="select" hx-target="#results" hx-swap="outerHTML settle:0" hx-replace-url="true"></nldd-menu-item>
{% endfor %}
</nldd-menu-group>
</nldd-toolbar-item>
