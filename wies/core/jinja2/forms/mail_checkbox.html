{# A lone checkbox with its label beside it: as_field_group would put the label
   above the box. The form has no send_mail field when Wies cannot send mail. #}
{% macro mail_checkbox(form) %}
  {% if "send_mail" in form.fields %}
    <nldd-spacer size="16" direction="vertical"></nldd-spacer>
    <nldd-checkbox-field name="{{ form.send_mail.html_name }}" label="{{ form.send_mail.label }}" {% if form.send_mail.value() %}checked{% endif %}></nldd-checkbox-field>
  {% endif %}
{% endmacro %}
