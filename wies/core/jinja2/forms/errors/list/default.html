{# Foutenlijst van een veld dat buiten nldd-form-field wordt gerenderd (de
   dienstenrijen in het opdrachtformulier). `invalid` staat er vast op: er is
   geen form-field die de zichtbaarheid regelt. #}
{% if errors %}
  <div class="field-errors">
    {% for error in errors %}<nldd-form-field-error-text invalid>{{ error }}</nldd-form-field-error-text>{% endfor %}
  </div>
{% endif %}
