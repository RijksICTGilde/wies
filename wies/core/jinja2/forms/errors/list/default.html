{# Errors rendered outside an nldd-form-field, such as non-field errors. An
   nldd-validation-list belongs to one control, so these are banners. #}
{% if errors %}
  <div class="field-errors">
    {% for error in errors %}<nldd-banner variant="critical" text="{{ error }}"></nldd-banner>{% endfor %}
  </div>
{% endif %}
