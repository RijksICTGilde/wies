{# Markdown editor for a description. The bar sits in the editor's toolbar
   slot: each control names its command in text-editor-command, and the editor
   runs it and keeps `selected` and `disabled` on the control and its overflow
   twin, for when the bar runs out of width in a narrow sheet. #}
<nldd-text-editor id="{{ widget.attrs.id }}" name="{{ widget.name }}" {% if widget.value %}value="{{ widget.value }}"{% endif %} rows="{{ widget.attrs.rows or 4 }}" resize="auto" {% if widget.attrs.required %}required{% endif %} {% if widget.attrs.autofocus %}autofocus{% endif %} {% if widget.attrs['accessible-label'] %}accessible-label="{{ widget.attrs['accessible-label'] }}"{% endif %} {% if widget.attrs.invalid %}invalid unmet="{{ widget.attrs['unmet'] }}"{% endif %}>
<nldd-toolbar slot="toolbar" accessible-label="Opmaak" size="sm">
<nldd-toolbar-item slot="start" label="Vet">
<nldd-toggle-button variant="icon" icon="bold" accessible-label="Vet" shortcut="Ctrl+B" shortcut-mac="Cmd+B" text-editor-command="bold"></nldd-toggle-button>
<nldd-menu-item slot="overflow" type="checkbox" text="Vet" icon="bold" text-editor-command="bold"></nldd-menu-item>
</nldd-toolbar-item>
<nldd-toolbar-item slot="start" label="Cursief">
<nldd-toggle-button variant="icon" icon="italic" accessible-label="Cursief" shortcut="Ctrl+I" shortcut-mac="Cmd+I" text-editor-command="italic"></nldd-toggle-button>
<nldd-menu-item slot="overflow" type="checkbox" text="Cursief" icon="italic" text-editor-command="italic"></nldd-menu-item>
</nldd-toolbar-item>
<nldd-toolbar-item slot="start" label="Doorhalen">
<nldd-toggle-button variant="icon" icon="strikethrough" accessible-label="Doorhalen" text-editor-command="strikethrough"></nldd-toggle-button>
<nldd-menu-item slot="overflow" type="checkbox" text="Doorhalen" icon="strikethrough" text-editor-command="strikethrough"></nldd-menu-item>
</nldd-toolbar-item>
<nldd-toolbar-item slot="start" label="Link">
<nldd-toggle-button variant="icon" icon="link" accessible-label="Link" shortcut="Ctrl+K" shortcut-mac="Cmd+K" text-editor-command="link"></nldd-toggle-button>
<nldd-menu-item slot="overflow" type="checkbox" text="Link" icon="link" text-editor-command="link"></nldd-menu-item>
</nldd-toolbar-item>
<nldd-toolbar-item slot="start" label="Citaat">
<nldd-toggle-button variant="icon" icon="text-quote" accessible-label="Citaat" text-editor-command="quote"></nldd-toggle-button>
<nldd-menu-item slot="overflow" type="checkbox" text="Citaat" icon="text-quote" text-editor-command="quote"></nldd-menu-item>
</nldd-toolbar-item>
<nldd-toolbar-item slot="start" label="Lijst">
<nldd-segmented-control type="radio" variant="icon" accessible-label="Lijst" text-editor-command="setList">
<nldd-segmented-control-item value="none" text="Geen lijst" icon="minus"></nldd-segmented-control-item>
<nldd-segmented-control-item value="bullet" text="Opsomming" icon="bullet-list"></nldd-segmented-control-item>
<nldd-segmented-control-item value="ordered" text="Genummerd" icon="numbered-list"></nldd-segmented-control-item>
</nldd-segmented-control>
<nldd-menu-item slot="overflow" type="radio" text="Geen lijst" icon="minus" text-editor-command="setList:none"></nldd-menu-item>
<nldd-menu-item slot="overflow" type="radio" text="Opsomming" icon="bullet-list" text-editor-command="setList:bullet"></nldd-menu-item>
<nldd-menu-item slot="overflow" type="radio" text="Genummerd" icon="numbered-list" text-editor-command="setList:ordered"></nldd-menu-item>
</nldd-toolbar-item>
<nldd-toolbar-item slot="start" label="Tekststijl">
<nldd-button appearance="secondary" expandable text="Tekststijl">
<nldd-menu slot="popup" placement="bottom-start">
<nldd-menu-item type="radio" text="Paragraaf" text-editor-command="setHeading:0"></nldd-menu-item>
<nldd-menu-item type="radio" text="Kop 1" text-editor-command="setHeading:1"></nldd-menu-item>
<nldd-menu-item type="radio" text="Kop 2" text-editor-command="setHeading:2"></nldd-menu-item>
<nldd-menu-item type="radio" text="Kop 3" text-editor-command="setHeading:3"></nldd-menu-item>
</nldd-menu>
</nldd-button>
<nldd-menu-item slot="overflow" type="radio" text="Paragraaf" text-editor-command="setHeading:0"></nldd-menu-item>
<nldd-menu-item slot="overflow" type="radio" text="Kop 1" text-editor-command="setHeading:1"></nldd-menu-item>
<nldd-menu-item slot="overflow" type="radio" text="Kop 2" text-editor-command="setHeading:2"></nldd-menu-item>
<nldd-menu-item slot="overflow" type="radio" text="Kop 3" text-editor-command="setHeading:3"></nldd-menu-item>
</nldd-toolbar-item>
</nldd-toolbar>
</nldd-text-editor>
