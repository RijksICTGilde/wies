{# NLDD date field: form-associated and submits the ISO value under one name, so
   DateInput with format %Y-%m-%d still applies. Its own calendar button replaces
   the browser datepicker, which could not be closed in Safari. `error-message`
   expects space-separated ids. #}
<nldd-date-field name="{{ widget.name }}" {% if widget.value != None %}value="{{ widget.value }}"{% endif %} {% if widget.attrs.required %}required{% endif %} {% if widget.attrs.placeholder %}placeholder="{{ widget.attrs.placeholder }}"{% endif %} {% if widget.attrs.width %}width="{{ widget.attrs.width }}"{% endif %} {% if widget.attrs.invalid %}invalid error-message="{{ widget.attrs['error-message'] }}"{% endif %}></nldd-date-field>
