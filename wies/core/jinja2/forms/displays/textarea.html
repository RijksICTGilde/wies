{# Show-more toggle: toggle-long-text in ui_handlers.js. #}
{% if value %}
  {% set collapsed = value|length > 300 or value.splitlines()|length > 5 %}
  <div class="wies-long-text{% if collapsed %} wies-long-text--collapsed{% endif %}">
    <div class="wies-long-text__body">
      <nldd-rich-text spacing="flat">{{ value|markdown }}</nldd-rich-text>
    </div>
    {% if collapsed %}
      <nldd-button class="inline-edit-show-more" size="sm" appearance="accent-transparent" start-icon="chevron-down" text="Toon meer" data-action="toggle-long-text"></nldd-button>
    {% endif %}
  </div>
{% else %}
  <span class="wies-text-secondary">Niet ingevuld</span>
{% endif %}
