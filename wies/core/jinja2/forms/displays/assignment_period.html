{% if value.start_date or value.end_date %}
  <span>
    {% if value.start_date %}
      {{ value.start_date|datum_nl }}
    {% else %}
      ?
    {% endif %}
    –
    {% if value.end_date %}
      {{ value.end_date|datum_nl }}
    {% else %}
      ?
    {% endif %}
  </span>
{% else %}
  <span class="wies-text-secondary">Geen periode opgegeven</span>
{% endif %}
