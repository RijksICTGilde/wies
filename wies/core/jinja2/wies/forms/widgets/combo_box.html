{# Echte NLDD combo box: typen filtert, kiezen legt vast. Form-associated, dus
   hij post onder `name` als een gewone <select>. De opties komen uit een
   geslot nldd-menu, net als bij nldd-token-field. #}
{% set selected_value = "" %}
{% for group_name, group_choices, group_index in widget.optgroups %}
  {% for option in group_choices %}
    {% if option.selected and option.value|string %}
      {% set selected_value = option.value|string %}
    {% endif %}
  {% endfor %}
{% endfor %}
<nldd-combo-box name="{{ widget.name }}" value="{{ selected_value }}" placeholder="{{ widget.attrs.placeholder|default('Kies of typ om te zoeken…') }}" {% if widget.attrs['accessible-label'] %}accessible-label="{{ widget.attrs['accessible-label'] }}"{% endif %} {% if widget.attrs.required %}required{% endif %} {% if widget.attrs.invalid %}invalid error-message="{{ widget.attrs['error-message'] }}"{% endif %}>
<nldd-menu variant="listbox" empty-text="Niets gevonden">
{% for group_name, group_choices, group_index in widget.optgroups %}
  {% for option in group_choices %}
    {% if option.value|string %}
      <nldd-menu-item value="{{ option.value }}" text="{{ option.label }}"></nldd-menu-item>
    {% endif %}
  {% endfor %}
{% endfor %}
</nldd-menu>
</nldd-combo-box>
